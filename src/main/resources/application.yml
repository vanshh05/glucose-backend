server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 10MB
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  application:
    name: glucose-backend
  codec:
    max-in-memory-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

glucose:
  model:
    endpoint: ${MODEL_ENDPOINT:https://glucospectra-gcnn.onrender.com/predict}
    timeout-seconds: ${MODEL_TIMEOUT_SECONDS:60}
    retries: ${MODEL_RETRIES:1}
  ingest:
    expected-samples: 3000
    expected-sampling-rate-hz: 100
    expected-channels: green_530,red_660,nir_940,dark_signal,skin_temp,pressure,accel_x,accel_y,accel_z
  security:
    device-api-key: ${DEVICE_API_KEY:dev-only-change-me}
  supabase:
    enabled: ${SUPABASE_ENABLED:false}
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}

logging:
  level:
    root: INFO
    com.glucospectra: DEBUG
